services:
  - type: web
    name: momentum-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: momentum-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: momentum-redis
          property: connectionString
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: WHATSAPP_PROVIDER
        value: cloud
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_CLOUD_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

  - type: worker
    name: momentum-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    dockerCommand: celery -A app.worker.celery_app worker --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: momentum-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: momentum-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: momentum-api
          envVarKey: JWT_SECRET
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: WHATSAPP_PROVIDER
        value: cloud
      - key: WHATSAPP_CLOUD_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

  - type: worker
    name: momentum-beat
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    dockerCommand: celery -A app.worker.celery_app beat --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: momentum-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: momentum-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: momentum-api
          envVarKey: JWT_SECRET
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: WHATSAPP_PROVIDER
        value: cloud
      - key: WHATSAPP_CLOUD_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

  - type: keyvalue
    name: momentum-redis
    plan: starter
    ipAllowList: []

databases:
  - name: momentum-db
    databaseName: momentum
    user: momentum
    plan: basic-256mb
